{{- /* mermaid 图表渲染 */ -}}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  /* 长流程图按自然尺寸渲染，超宽时横向滚动，避免文字被缩放压扁或溢出截断 */
  .mermaid { overflow-x: auto; text-align: center; }
  .mermaid svg { max-width: none; height: auto; display: inline-block; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (typeof mermaid === "undefined") return;
    mermaid.initialize({
      startOnLoad: false,
      theme: "default",
      securityLevel: "loose",
      flowchart: {
        useMaxWidth: false,    /* 不强制缩放到容器宽度 */
        wrappingWidth: 800,    /* 节点文字到该宽度自动换行 */
        htmlLabels: true,
        nodeSpacing: 50,
        rankSpacing: 50
      }
    });
    document.querySelectorAll('pre code.language-mermaid').forEach(function (codeEl) {
      var pre = codeEl.parentNode;
      var div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = codeEl.textContent;
      pre.parentNode.replaceChild(div, pre);
    });
    mermaid.run();
  });
</script>

{{- /* KaTeX 数学公式渲染（front matter 设 math: true 时启用，与博客搭建记录约定一致） */ -}}
{{- if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/contrib/auto-render.min.js" crossorigin="anonymous"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});"></script>
<style>
  /* 长公式横向滚动，避免溢出容器 */
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.5em 0; }
</style>
{{- end }}
